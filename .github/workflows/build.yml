name: Build APK
on:
  push:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: 8.2
      - name: Download Xray core
        run: |
          mkdir -p app/libs
          curl -L -o app/libs/libv2ray.aar https://github.com/2dust/AndroidLibXrayLite/releases/download/v26.11.9/libv2ray.aar
          ls -l app/libs
      - name: Show core API
        run: |
          unzip -p app/libs/libv2ray.aar classes.jar > /tmp/c.jar
          CLASSES=$(unzip -Z1 /tmp/c.jar | grep '^libv2ray/.*\.class$' | sed 's/\.class$//; s|/|.|g')
          echo "$CLASSES"
          javap -cp /tmp/c.jar $CLASSES || true
      - name: Decode keystore
        run: echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 -d > app/zentra.jks
      - name: Build release APK
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: gradle assembleRelease
      - uses: actions/upload-artifact@v4
        with:
          name: Zentra-release
          path: app/build/outputs/apk/release/*.apk
